# Self-hosted GitHub Actions runner inside the Docker Desktop cluster, next to DOP, so jobs reach the
# DBmaestro agent at agent.dop.svc.cluster.local:80 (no port-forward, no public endpoint).
#
# Registration: org-level runner in the DBMaestroDev runner group "dbmaestro-github-demo". The group is
# limited to this repository and allows public repositories. The org's other groups don't, and a
# repo-level runner on a public repo is subject to that policy: jobs stay queued forever.
#
# Image: the official ghcr.io/actions/actions-runner. Docker Desktop's kind node cannot see images built
# on the host, so instead of a custom image the start script installs Java + jq, then registers with a
# token fetched through GITHUB_TOKEN (needs admin:org; --replace: a restarted pod re-registers the same
# name). Auto-update is disabled because an in-place update leaves the container without
# bin/Runner.Listener and it crash-restarts; bump the image tag instead. The DBmaestro CLI jar is
# downloaded by the workflow from DBMaestroDev/DBmaestroCLI (dbmaestro-cicd get-cli-jar action).
#
#   kubectl create namespace github-runner
#   kubectl -n github-runner create secret generic github-token --from-file=token=<file holding `gh auth token`>
#   kubectl apply -f runner/runner.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-runner-start
  namespace: github-runner
data:
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "Installing Java 21 + jq..."
    sudo apt-get update -qq
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openjdk-21-jre-headless jq git curl >/dev/null
    java -version 2>&1 | head -1

    api="https://api.github.com/orgs/${GITHUB_ORG}/actions/runners"
    token() { curl -fsS -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$api/$1" | jq -r .token; }

    cd /home/runner
    ./config.sh --unattended --replace --disableupdate \
      --url "https://github.com/${GITHUB_ORG}" --token "$(token registration-token)" \
      --runnergroup "${RUNNER_GROUP}" --no-default-labels \
      --name "${RUNNER_NAME}" --labels "${RUNNER_LABELS}" --work _work

    cleanup() { ./config.sh remove --token "$(token remove-token)" || true; }
    trap cleanup EXIT TERM INT
    ./run.sh & wait $!
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-runner
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: github-runner } }
  template:
    metadata: { labels: { app: github-runner } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.338.2   # auto-update is off: bump this tag instead
          command: ["/bin/bash", "/opt/start/start.sh"]
          env:
            - { name: GITHUB_ORG,    value: DBMaestroDev }
            - { name: RUNNER_GROUP,  value: dbmaestro-github-demo }
            - { name: RUNNER_NAME,   value: dop-k8s-runner }
            - { name: RUNNER_LABELS, value: "self-hosted,linux,dbmaestro-k8s" }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: github-token, key: token } }
          volumeMounts:
            - { name: start, mountPath: /opt/start }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { memory: 2Gi }
      volumes:
        - name: start
          configMap: { name: github-runner-start }
